<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>CatBlocker</title>
    <link rel="stylesheet" href="popup.css" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
</head>
<body>
<header>
    <img src="../icons/icon128.png" alt="CatBlocker" />
    <h1>CatBlocker</h1>
</header>

<main>
    <div class="row">
        <label class="switch">
            <input type="checkbox" id="toggleEnabled" />
            <span class="slider"></span>
        </label>
        <span id="enabledLabel">Enabled</span>
    </div>

    <div class="row">
        <label for="intensity">Intensity</label>
        <select id="intensity">
            <option value="gentle">Gentle</option>
            <option value="balanced">Balanced</option>
            <option value="aggressive">Aggressive</option>
        </select>
    </div>

    <div class="stats">
        <div class="stat">
            <div class="value" id="sessionCount">0</div>
            <div class="label">Replaced (this page)</div>
        </div>
        <div class="stat">
            <div class="value" id="globalCount">0</div>
            <div class="label">Replaced (all time)</div>
        </div>
    </div>

    <div class="actions">
        <button id="replaceNow">Replace on this page</button>
        <button id="openOptions">Options</button>
    </div>

    <div class="row small">
        <input type="text" id="hostname" readonly />
        <button id="toggleWhitelist">Whitelist domain</button>
    </div>
</main>

<script src="popup.js"></script>
</body>
</html>
