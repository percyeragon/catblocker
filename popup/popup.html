<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>CatBlocker</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="popup.css" />
</head>
<body>
<div class="shell">
    <header class="header">
        <div class="logo">
            <img src="../icons/icon-128.png" alt="CatBlocker logo" />
        </div>
        <div class="titles">
            <h1>CatBlocker</h1>
            <p>Replace ads with cats. Meow.</p>
        </div>
        <label class="switch" title="Enable/Disable">
            <input type="checkbox" id="toggleEnabled" />
            <span class="slider"></span>
        </label>
    </header>

    <section class="card">
        <div class="row between">
            <span class="label">Status</span>
            <span id="enabledLabel" class="badge">Disabled</span>
        </div>

        <div class="intensity">
            <span class="label">Intensity</span>
            <div class="segmented" role="tablist" aria-label="Intensity">
                <button class="seg" data-value="gentle" role="tab" aria-selected="false">Gentle</button>
                <button class="seg" data-value="balanced" role="tab" aria-selected="true">Balanced</button>
                <button class="seg" data-value="aggressive" role="tab" aria-selected="false">Aggressive</button>
            </div>
            <select id="intensity" class="sr-only" aria-hidden="true">
                <option value="gentle">Gentle</option>
                <option value="balanced" selected>Balanced</option>
                <option value="aggressive">Aggressive</option>
            </select>
        </div>
    </section>

    <section class="stats card">
        <div class="stat">
            <div class="value" id="sessionCount">0</div>
            <div class="caption">This page</div>
        </div>
        <div class="divider"></div>
        <div class="stat">
            <div class="value" id="globalCount">0</div>
            <div class="caption">All time</div>
        </div>
    </section>

    <section class="card">
        <div class="row domain">
            <span class="domain-icon" aria-hidden="true">🌐</span>
            <input type="text" id="hostname" class="domain-input" readonly />
            <button id="toggleWhitelist" class="chip" title="Toggle whitelist">Whitelist</button>
        </div>
        <div class="actions">
            <button id="replaceNow" class="btn primary">Replace now</button>
            <button id="openOptions" class="btn">Options</button>
        </div>
    </section>

    <footer class="footer">
        <span class="hint">Tip: Use the context menu to trigger a scan.</span>
    </footer>
</div>

<div id="toast" role="status" aria-live="polite"></div>
<script src="popup.js"></script>
</body>
</html>
